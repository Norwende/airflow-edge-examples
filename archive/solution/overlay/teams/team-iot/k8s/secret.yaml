# Secret JWT partagé avec l'api-server central (valeur du contrat, démo uniquement)
# + connexion minio_s3 au format JSON (le worker n'a pas de base : AIRFLOW_CONN_MINIO_S3),
# utilisée par le logging distant S3 et le backend XCom object storage (docs/09 étape 12).
apiVersion: v1
kind: Secret
metadata:
  name: airflow-edge-worker
  namespace: team-iot
type: Opaque
stringData:
  jwt-secret: airflow-edge-demo-jwt-secret-please-change-0123456789
  minio-conn: >-
    {"conn_type": "aws", "login": "minio", "password": "minio12345",
    "extra": {"endpoint_url": "http://minio.airflow-edge.svc.cluster.local:9000", "region_name": "us-east-1"}}
