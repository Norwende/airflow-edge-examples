# notes-api — environnement prod (namespace gitops-prod).
# L'image (repository/tag) n'est PAS ici : voir version.yaml (écrit par la CI).
env: prod
logLevel: INFO
replicaCount: 2
ingress:
  enabled: true
  host: notes.prod.127-0-0-1.sslip.io
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi
podDisruptionBudget:
  enabled: true
  minAvailable: 1
topologySpread:
  enabled: true
