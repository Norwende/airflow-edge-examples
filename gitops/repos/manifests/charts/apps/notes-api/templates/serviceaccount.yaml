{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "notes-api.serviceAccountName" . }}
  labels:
    {{- include "notes-api.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# L'application n'appelle jamais l'API Kubernetes : pas de token monté.
automountServiceAccountToken: false
{{- end }}
