{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "notes-api.fullname" . }}
  labels:
    {{- include "notes-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "notes-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Trafic HTTP depuis l'Ingress controller (Traefik).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - port: http
          protocol: TCP
  egress:
    # DNS du cluster.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL (pods CNPG du Cluster notes-pg, même namespace).
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: notes-pg
      ports:
        - port: {{ .Values.networkPolicy.postgresPort }}
          protocol: TCP
{{- end }}
