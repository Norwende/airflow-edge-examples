apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "filebeat.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "filebeat.labels" . | nindent 4 }}
---
# Lecture des métadonnées Kubernetes (autodiscover + add_kubernetes_metadata).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "filebeat.name" . }}
  labels:
    {{- include "filebeat.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "filebeat.name" . }}
  labels:
    {{- include "filebeat.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "filebeat.name" . }}
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "filebeat.name" . }}
